
{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Портфоліо Андрія{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="background-effects" aria-hidden="true">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
</div>

<header class="site-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}" data-page-link>
                ANDRII<span>.</span>
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navigation"
                    aria-label="Відкрити меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navigation">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}" data-page-link>Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'about' %}" data-page-link>Про мене</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'projects' %}" data-page-link>Проєкти</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'skills' %}" data-page-link>Навички</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'journey' %}" data-page-link>Мій шлях</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'contacts' %}" data-page-link>Контакти</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="container main-content" id="page-content">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <p>© 2026 Андрій · Моє портфоліо</p>
    <p class="footer-note">Створено з цікавістю до технологій.</p>
</footer>

<div class="music-player">
    <span id="music-status" class="music-status">Музика вимкнена</span>

    <button id="music-toggle" class="music-button" type="button">
        ♫ Увімкнути музику
    </button>

    <audio id="background-music" loop preload="auto">
        <source src="{% static 'music/Пісня 1.mp3' %}" type="audio/mpeg">
    </audio>
</div>

<script>
(() => {
    const music = document.getElementById("background-music");
    const button = document.getElementById("music-toggle");
    const status = document.getElementById("music-status");
    const content = document.getElementById("page-content");

    music.volume = 0.22;

    button.addEventListener("click", async () => {
        if (music.paused) {
            try {
                await music.play();
                button.textContent = "♫ Вимкнути музику";
                status.textContent = "Музика грає";
            } catch (error) {
                status.textContent = "Перевір файл Пісня 1.mp3";
            }
        } else {
            music.pause();
            button.textContent = "♫ Увімкнути музику";
            status.textContent = "Музика вимкнена";
        }
    });

    async function navigate(url, push = true) {
        try {
            const response = await fetch(url);

            if (!response.ok) {
                location.href = url;
                return;
            }

            const html = await response.text();
            const doc = new DOMParser().parseFromString(html, "text/html");
            const next = doc.querySelector("#page-content");

            if (!next) {
                location.href = url;
                return;
            }

            content.innerHTML = next.innerHTML;
            document.title = doc.title;

            if (push) {
                history.pushState({}, "", url);
            }

            document.querySelectorAll("[data-page-link]").forEach(link => {
                link.classList.toggle(
                    "active",
                    new URL(link.href).pathname === location.pathname
                );
            });

            document.querySelector("#navigation")?.classList.remove("show");
            window.scrollTo({ top: 0, behavior: "smooth" });

        } catch (error) {
            location.href = url;
        }
    }

    document.addEventListener("click", event => {
        const link = event.target.closest("a[data-page-link]");

        if (!link ||
            event.ctrlKey ||
            event.metaKey ||
            event.shiftKey ||
            event.altKey ||
            link.target === "_blank" ||
            new URL(link.href).origin !== location.origin) {
            return;
        }

        event.preventDefault();
        navigate(link.href);
    });

    window.addEventListener("popstate", () => {
        navigate(location.href, false);
    });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
