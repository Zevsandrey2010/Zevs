```html
{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Моє портфоліо{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="background-effects">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>
    </div>

    <header class="site-header">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">
                    МОЄ ПОРТФОЛІО
                </a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navigation">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}">Головна</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}#about">Про мене</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}#projects">Мої проєкти</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}#contacts">Контакти</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>© 2026 Моє портфоліо. Створено з натхненням.</p>
    </footer>

    <div class="music-player">
        <audio id="background-music" loop>
            <source src="{% static 'music/Пісня 1.mp3' %}" type="audio/mpeg">
            Ваш браузер не підтримує відтворення аудіо.
        </audio>

        <button id="music-toggle" class="music-button" type="button">
            ♫ Увімкнути музику
        </button>
    </div>

    <script>
        const music = document.getElementById("background-music");
        const musicButton = document.getElementById("music-toggle");

        music.volume = 0.2;

        musicButton.addEventListener("click", async () => {
            if (music.paused) {
                try {
                    await music.play();
                    musicButton.textContent = "♫ Вимкнути музику";
                } catch (error) {
                    musicButton.textContent = "Не вдалося відтворити музику";
                }
            } else {
                music.pause();
                musicButton.textContent = "♫ Увімкнути музику";
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
```
